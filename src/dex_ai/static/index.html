<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Balance Dex · Add a bill</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<canvas class="page-pixels" aria-hidden="true" data-quiet=".hero-text > *, .card, .activity, .brand"></canvas>

<nav class="topbar">
  <a class="brand" href="/">
    <span class="brand-icon">
      <svg class="brand-mark" viewBox="0 0 8 5" shape-rendering="crispEdges" aria-hidden="true" focusable="false"><path fill="currentColor" d="M1 0h1v1H1zM6 0h1v1H6zM0 1h1v4H0zM7 1h1v4H7zM2 1h1v1H2zM5 1h1v1H5zM3 2h2v1H3z"/><path class="brand-mark-eyes" d="M2.3333 3.3333h.6667v.6667h-.6667zM5 3.3333h.6667v.6667H5z"/></svg>
    </span>
    <span class="brand-name">Balance Dex</span>
  </a>
</nav>

<main class="layout" id="layout">
  <header class="hero-text">
    <h1>Instantly add, without the hassle</h1>
    <p class="lede">Dex will handle all of it</p>
  </header>

  <div class="cols">
    <div class="col-main">
      <section class="card hero" id="receipt-card">
        <label class="drop" id="drop">
          <input type="file" id="photo" accept="image/jpeg,image/png,image/webp" capture="environment" hidden>
          <span class="drop-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h3l2-2.5h6L17 7h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.5"/></svg>
          </span>
          <strong>Snap or choose the bill</strong>
        </label>
        <div class="receipt-summary" id="receipt-summary" hidden>
          <img id="thumb" alt="">
          <div class="sum-text">
            <strong id="sum-title"></strong>
            <span id="sum-meta"></span>
          </div>
          <button type="button" class="link" id="new-receipt">New receipt</button>
        </div>
      </section>

      <ol class="activity" id="activity" aria-live="polite"></ol>

      <section class="card chat" id="voice-card" hidden>
        <button type="button" class="chat-fox dex-pet" id="dex-pet" aria-label="Dex, tap to say hi">
          <svg aria-hidden="true" viewBox="0 0 18 12" shape-rendering="crispEdges">
              <g class="fox">
                  <!-- bushy tail sweeping up behind, white tip -->
                  <g class="fox-tail">
                      <rect x="15" y="3" width="3" height="1" fill="#f5fff9"/>
                      <rect x="14" y="4" width="1" height="1" fill="#4fb87f"/>
                      <rect x="15" y="4" width="3" height="1" fill="#f5fff9"/>
                      <rect x="13" y="5" width="3" height="1" fill="#4fb87f"/>
                      <rect x="16" y="5" width="2" height="1" fill="#f5fff9"/>
                      <rect x="12" y="6" width="5" height="1" fill="#4fb87f"/>
                      <rect x="17" y="6" width="1" height="1" fill="#1f6b46"/>
                      <rect x="12" y="7" width="4" height="1" fill="#4fb87f"/>
                      <rect x="16" y="7" width="1" height="1" fill="#1f6b46"/>
                      <rect x="12" y="8" width="3" height="1" fill="#4fb87f"/>
                      <rect x="15" y="8" width="1" height="1" fill="#1f6b46"/>
                      <rect x="12" y="9" width="2" height="1" fill="#4fb87f"/>
                      <rect x="14" y="9" width="1" height="1" fill="#1f6b46"/>
                  </g>
          
                  <!-- dark outline -->
                  <g fill="#1f6b46">
                      <rect x="2" y="0" width="1" height="1"/>
                      <rect x="1" y="1" width="1" height="1"/>
                      <rect x="3" y="1" width="1" height="1"/>
                      <rect x="1" y="2" width="1" height="1"/>
                      <rect x="4" y="2" width="1" height="1"/>
                      <rect x="1" y="3" width="1" height="1"/>
                      <rect x="10" y="3" width="1" height="1"/>
                      <rect x="0" y="4" width="1" height="6"/>
                      <rect x="11" y="4" width="1" height="6"/>
                      <rect x="2" y="11" width="3" height="1"/>
                      <rect x="7" y="11" width="3" height="1"/>
                  </g>
          
                  <!-- green fur -->
                  <g fill="#4fb87f">
                      <rect x="2" y="1" width="1" height="1"/>
                      <rect x="2" y="2" width="2" height="1"/>
                      <rect x="2" y="3" width="8" height="1"/>
                      <rect x="1" y="4" width="10" height="1"/>
                      <rect x="1" y="5" width="10" height="1"/>
                      <rect x="1" y="6" width="2" height="1"/>
                      <rect x="5" y="6" width="2" height="1"/>
                      <rect x="9" y="6" width="2" height="1"/>
                      <rect x="1" y="7" width="2" height="1"/>
                      <rect x="9" y="7" width="2" height="1"/>
                      <rect x="1" y="8" width="1" height="1"/>
                      <rect x="10" y="8" width="1" height="1"/>
                      <rect x="1" y="9" width="1" height="1"/>
                      <rect x="10" y="9" width="1" height="1"/>
                      <rect x="2" y="10" width="3" height="1"/>
                      <rect x="7" y="10" width="3" height="1"/>
                  </g>
          
                  <!-- light mint muzzle -->
                  <g fill="#aee8c9">
                      <rect x="5" y="7" width="2" height="1"/>
                      <rect x="2" y="8" width="3" height="1"/>
                      <rect x="7" y="8" width="3" height="1"/>
                      <rect x="2" y="9" width="8" height="1"/>
                  </g>
          
                  <!-- nose -->
                  <rect x="5" y="8" width="2" height="1" fill="#15241d"/>
          
                  <!-- right ear (twitches) -->
                  <g class="fox-ear-r">
                      <rect x="9"  y="0" width="1" height="1" fill="#1f6b46"/>
                      <rect x="8"  y="1" width="1" height="1" fill="#1f6b46"/>
                      <rect x="9"  y="1" width="1" height="1" fill="#4fb87f"/>
                      <rect x="10" y="1" width="1" height="1" fill="#1f6b46"/>
                      <rect x="7"  y="2" width="1" height="1" fill="#1f6b46"/>
                      <rect x="8"  y="2" width="2" height="1" fill="#4fb87f"/>
                      <rect x="10" y="2" width="1" height="1" fill="#1f6b46"/>
                  </g>
          
                  <!-- eyes (blink / wink) with catchlight sparkle -->
                  <g class="fox-eyes">
                      <g class="fox-eye-l">
                          <rect x="3" y="6" width="2" height="2" fill="#15241d"/>
                          <rect x="4" y="6" width="1" height="1" fill="#f5fff9"/>
                      </g>
                      <g class="fox-eye-r">
                          <rect x="7" y="6" width="2" height="2" fill="#15241d"/>
                          <rect x="8" y="6" width="1" height="1" fill="#f5fff9"/>
                      </g>
                  </g>
              </g>
          </svg>
        </button>
        <div class="chat-log" id="convo" aria-live="polite"></div>
        <div class="starters" id="starters"></div>
        <!-- People come from the conversation; this holds them for the page's own use. -->
        <input id="people" type="hidden">
        <div class="contacts" id="contacts" hidden></div>
        <form class="chat-input" id="type-form">
          <input id="typed" type="text" placeholder="Tell Dex who had what, or ask about the bill…" autocomplete="off" aria-label="Message Dex">
          <button type="button" class="mic icon-btn" id="mic-btn" aria-pressed="false" title="Hold to talk">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>
            <span class="sr-only" id="mic-label">Hold to talk</span>
          </button>
          <button type="submit" class="send icon-btn" aria-label="Send">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg>
          </button>
        </form>
        <p class="hint" id="talk-hint" hidden></p>
      </section>
    </div>

    <aside class="col-side card" id="proposal-card" hidden>
      <div class="card-head">
        <h2>The split</h2>
        <span class="badge" id="state-badge"></span>
      </div>

      <div class="entry" id="entry">
        <p class="entry-title" id="entry-title"></p>
        <p class="entry-meta" id="entry-meta"></p>
      </div>

      <ul class="people" id="people-out"></ul>
      <p class="meta" id="balance-out"></p>

      <details class="receipt-view" id="receipt-view">
        <summary>See it on the receipt</summary>

      <div class="segmented views" id="views" role="tablist" aria-label="View" hidden>
        <button role="tab" aria-selected="true" data-view="photo">Photo</button>
        <button role="tab" aria-selected="false" data-view="list">List</button>
      </div>

      <div class="photo-view" id="photo-view" hidden>
        <div class="photo-wrap">
          <img id="photo-img" alt="Your receipt with each item marked">
          <div class="spots" id="spots"></div>
        </div>
        <div id="photo-editor"></div>
      </div>

      <div class="paper" id="paper">
        <p class="paper-head" id="paper-head"></p>
        <ul class="lines-out" id="lines-out"></ul>
        <dl class="paper-totals" id="paper-totals"></dl>
      </div>

      </details>

      <div class="bar" id="bar" aria-hidden="true" hidden></div>
      <div class="settle" id="settle-out" hidden></div>

      <details class="options" id="options">
        <summary id="options-summary"></summary>
        <div class="options-body">
          <label class="field inline">
            <span>Paid by</span>
            <select id="payer"></select>
          </label>
          <div class="segmented" id="taxtip" role="radiogroup" aria-label="Tax and tip">
            <button role="radio" aria-checked="true" data-mode="proportional">Tax &amp; tip by what you had</button>
            <button role="radio" aria-checked="false" data-mode="equal">Split evenly</button>
          </div>
        </div>
      </details>

      <button class="primary" id="approve-btn" disabled>Looks right</button>

      <div class="approved" id="approved" hidden>
        <div class="bd-save" id="bd-save" hidden>
          <h3>Save to Balance Dex</h3>
          <label class="field inline" id="bd-method-field">
            <span>You paid with</span>
            <input id="bd-method" list="bd-methods" placeholder="Amex, Venmo, Cash…" autocomplete="off">
            <datalist id="bd-methods"></datalist>
          </label>
          <p class="meta" id="bd-new"></p>
          <button class="primary" id="bd-save-btn">Save to Balance Dex</button>
          <p class="status" id="bd-status" role="status"></p>
        </div>
        <pre id="settle-msg"></pre>
        <div class="row-btns">
          <button class="secondary" id="copy-btn">Copy message</button>
          <button class="secondary" id="edit-btn">Edit again</button>
        </div>
      </div>
    </aside>
  </div>
</main>
<script src="/static/app.js"></script>
<script src="/static/pixels.js"></script>
</body>
</html>
