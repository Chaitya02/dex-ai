<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dex · Split it</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<main>
  <header>
    <p class="eyebrow">Dex</p>
    <h1>Split it, out loud.</h1>
    <p class="lede">Snap the bill, say who had what.</p>
  </header>

  <section class="card" id="receipt-card">
    <div class="card-head">
      <span class="step">1</span>
      <h2>Receipt</h2>
    </div>
    <label class="drop" id="drop">
      <input type="file" id="photo" accept="image/jpeg,image/png,image/webp" capture="environment" hidden>
      <img id="preview" alt="" hidden>
      <span id="drop-hint">Take a photo or choose one</span>
    </label>
    <button class="primary" id="read-btn" disabled>Read receipt</button>
    <p class="status" id="receipt-status" role="status"></p>
    <ul class="checks" id="checks"></ul>
  </section>

  <section class="card" id="voice-card">
    <div class="card-head">
      <span class="step">2</span>
      <h2>Who had what</h2>
    </div>
    <label class="field">
      <span>Who's splitting</span>
      <input id="people" type="text" placeholder="Aayush, Ketan, Kunal" autocomplete="off">
    </label>
    <ol class="convo" id="convo" aria-live="polite"></ol>
    <p class="hint" id="talk-hint">Hold the button and talk: “I had the pasta, Aayush and Ketan split the pizza, everyone shared the fries.”</p>
    <button class="mic" id="mic-btn" aria-pressed="false">
      <span class="dot"></span><span id="mic-label">Hold to talk</span>
    </button>
    <form class="type-it" id="type-form">
      <input id="typed" type="text" placeholder="…or type it" autocomplete="off" aria-label="Type who had what">
      <button type="submit">Send</button>
    </form>
    <p class="status" id="voice-status" role="status"></p>
  </section>

  <section class="card" id="proposal-card" hidden>
    <div class="card-head">
      <span class="step">3</span>
      <h2>Dex's split</h2>
      <span class="badge" id="state-badge"></span>
    </div>

    <div class="segmented views" id="views" role="tablist" aria-label="View" hidden>
      <button role="tab" aria-selected="true" data-view="photo">Photo</button>
      <button role="tab" aria-selected="false" data-view="list">List</button>
    </div>

    <div class="photo-view" id="photo-view" hidden>
      <div class="photo-wrap">
        <img id="photo-img" alt="Your receipt with each item marked">
        <div class="spots" id="spots"></div>
      </div>
      <div id="photo-editor"></div>
      <p class="meta" id="sam-note"></p>
    </div>

    <div class="paper" id="paper">
      <p class="paper-head" id="paper-head"></p>
      <ul class="lines-out" id="lines-out"></ul>
      <dl class="paper-totals" id="paper-totals"></dl>
    </div>

    <div class="bar" id="bar" aria-hidden="true"></div>
    <ul class="people" id="people-out"></ul>

    <div class="options">
      <label class="field inline">
        <span>Paid by</span>
        <select id="payer"></select>
      </label>
      <div class="segmented" id="taxtip" role="radiogroup" aria-label="Tax and tip">
        <button role="radio" aria-checked="true" data-mode="proportional">Tax &amp; tip by what you had</button>
        <button role="radio" aria-checked="false" data-mode="equal">Split evenly</button>
      </div>
    </div>

    <div class="settle" id="settle-out"></div>
    <p class="meta" id="balance-out"></p>
    <button class="primary" id="approve-btn" disabled>Looks right</button>

    <div class="approved" id="approved" hidden>
      <pre id="settle-msg"></pre>
      <div class="row-btns">
        <button class="secondary" id="copy-btn">Copy message</button>
        <button class="secondary" id="edit-btn">Edit again</button>
      </div>
    </div>
  </section>
</main>
<script src="/static/app.js"></script>
</body>
</html>
