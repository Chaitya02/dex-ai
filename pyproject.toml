[project]
name = "dex-ai"
version = "0.1.0"
description = "Dex: a voice-first agentic expense companion on Meta models"
readme = "README.md"
authors = [
    { name = "Chaitya Dobariya", email = "chaityadobariya02@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "openai>=3.38.0",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
dex-ai = "dex_ai:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
